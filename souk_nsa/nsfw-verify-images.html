<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فحص الصور</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f2f5; padding: 24px; color: #222; }
    h1 { text-align: center; margin-bottom: 24px; font-size: 1.4rem; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px #0001; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; color: #555; }
    input[type="file"] { display: none; }
    .upload-btn, .check-btn {
      display: inline-block; padding: 10px 24px; border-radius: 8px;
      cursor: pointer; font-size: 0.95rem; border: none;
    }
    .upload-btn { background: #e8f0fe; color: #1a73e8; border: 2px dashed #1a73e8; width: 100%; text-align: center; padding: 16px; }
    .upload-btn:hover { background: #d2e3fc; }
    .check-btn { background: #1a73e8; color: white; width: 100%; margin-top: 12px; padding: 12px; font-size: 1rem; }
    .check-btn:hover { background: #1558b0; }
    .check-btn:disabled { background: #aaa; cursor: not-allowed; }
    #preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .img-wrap { position: relative; width: 120px; }
    .img-wrap img { width: 120px; height: 100px; object-fit: cover; border-radius: 8px; border: 2px solid #ddd; }
    .img-wrap .badge {
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white; font-size: 0.7rem;
      padding: 2px 6px; border-radius: 4px; white-space: nowrap;
    }
    .badge.safe { background: rgba(34,139,34,0.85); }
    .badge.unsafe { background: rgba(200,0,0,0.85); }
    #console {
      background: #1e1e1e; color: #d4d4d4; border-radius: 8px;
      padding: 14px; font-family: monospace; font-size: 0.85rem;
      min-height: 120px; max-height: 300px; overflow-y: auto;
      direction: ltr; text-align: left; white-space: pre-wrap;
    }
    .log-info { color: #9cdcfe; }
    .log-ok { color: #4ec9b0; }
    .log-err { color: #f48771; }
    .log-warn { color: #dcdcaa; }
  </style>
</head>
<body>
  <h1>🔍 فحص محتوى الصور</h1>

  <div class="card">
    <label>🖼️ الصور</label>
    <label for="file-input" class="upload-btn">اضغط لاختيار صورة أو عدة صور</label>
    <input type="file" id="file-input" accept="image/*" multiple />
    <div id="preview-container"></div>
    <button class="check-btn" id="check-btn" disabled>فحص الصور</button>
  </div>

  <div class="card">
    <label>🖥️ Console</label>
    <div id="console"></div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const checkBtn = document.getElementById('check-btn');
    const consoleEl = document.getElementById('console');

    let selectedFiles = [];

    function log(msg, type = 'info') {
      const span = document.createElement('span');
      span.className = `log-${type}`;
      span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      consoleEl.appendChild(span);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    fileInput.addEventListener('change', () => {
      selectedFiles = Array.from(fileInput.files);
      previewContainer.innerHTML = '';
      selectedFiles.forEach((file, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'img-wrap';
        wrap.id = `img-wrap-${i}`;
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        wrap.appendChild(img);
        previewContainer.appendChild(wrap);
      });
      checkBtn.disabled = selectedFiles.length === 0;
      log(`تم اختيار ${selectedFiles.length} صورة`, 'info');
    });

    async function checkImage(file, index) {
      log(`جاري فحص: ${file.name}`, 'info');
      const buffer = await file.arrayBuffer();

      try {
        const res = await fetch(
          'https://nsfw-checker.houssemhoussam25.workers.dev',
          {
            method: 'POST',
            body: buffer,
          }
        );

        if (!res.ok) {
          const err = await res.text();
          log(`❌ خطأ HTTP ${res.status}: ${err}`, 'err');
          return;
        }

        const result = await res.json();
        log(`✅ نتيجة ${file.name}: ${JSON.stringify(result)}`, 'ok');

        const wrap = document.getElementById(`img-wrap-${index}`);
        const badge = document.createElement('div');

        // نتيجة Cloudflare AI تأتي بهذا الشكل: { result: { nsfw: 0.1, sfw: 0.9 } }
        const data = result.result || result;
        const nsfwScore = data.nsfw ?? 0;
        const isUnsafe = nsfwScore > 0.5;

        badge.className = 'badge ' + (isUnsafe ? 'unsafe' : 'safe');
        badge.textContent = isUnsafe
          ? `✘ NSFW ${(nsfwScore * 100).toFixed(0)}%`
          : `✔ آمن ${((1 - nsfwScore) * 100).toFixed(0)}%`;
        wrap.appendChild(badge);

      } catch (e) {
        log(`❌ استثناء: ${e.message}`, 'err');
      }
    }

    checkBtn.addEventListener('click', async () => {
      checkBtn.disabled = true;
      log('--- بدء الفحص ---', 'warn');
      for (let i = 0; i < selectedFiles.length; i++) {
        await checkImage(selectedFiles[i], i);
      }
      log('--- انتهى الفحص ---', 'warn');
      checkBtn.disabled = false;
    });
  </script>
</body>
</html>
