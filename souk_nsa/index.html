<script>
/* تجاوز mountChrome لبناء bottom-nav بأيقونات SVG + زر الحساب يمينًا */
document.addEventListener('DOMContentLoaded', function () {
  var _origMount;
  function patchApp() {
    if (!window.App) { setTimeout(patchApp, 50); return; }
    var origMount = App.mountChrome.bind(App);
    App.mountChrome = function () {
      /* استدعاء الأصلي */
      origMount();
      /* استبدال محتوى bottom-nav */
      var nav = document.querySelector('.bottom-nav');
      if (!nav) return;
      var R = window.CONFIG && window.CONFIG.ROUTES || {};
      nav.innerHTML = '';
      var items = [
        { route: R.HOME || '#', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>', key: 'home' },
        { route: R.FAVS || '#favs', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.7-4.35-9.33-8.02C.86 10.6 1.2 7.3 3.6 5.4 5.8 3.66 8.9 4.1 10.6 6.1L12 7.7l1.4-1.6c1.7-2 4.8-2.44 7-.7 2.4 1.9 2.74 5.2.93 7.58C18.7 16.65 12 21 12 21z"/></svg>', key: 'favs' },
        { route: R.POST || '#post', plus: true },
        { route: R.NOTIFS || '#notifs', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>', badge: true },
        { route: R.PROFILE || '#profile', account: true }
      ];
      items.forEach(function (n) {
        var a = document.createElement('a');
        a.href = n.route;
        a.setAttribute('data-route', n.route);
        if (n.plus) {
          var sp = document.createElement('span');
          sp.className = 'plus';
          sp.textContent = '+';
          a.appendChild(sp);
        } else if (n.account) {
          var wrap = document.createElement('span');
          wrap.style.cssText = 'position:relative;width:28px;height:28px;border-radius:50%;display:inline-flex;flex:none;';
          var img = document.createElement('img');
          img.src = 'assets/images/avatar.svg';
          img.id = 'nav-avatar-img';
          img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.8);';
          img.alt = '';
          wrap.appendChild(img);
          /* نقطة أونلاين */
          var dot = document.createElement('span');
          dot.style.cssText = 'position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:#10B981;border:2px solid var(--c-primary);';
          wrap.appendChild(dot);
          a.appendChild(wrap);
        } else {
          a.innerHTML = n.svg || '';
          if (n.badge) {
            var b = document.createElement('span');
            b.className = 'dot-badge';
            b.setAttribute('data-notif-badge', '');
            b.hidden = true;
            a.appendChild(b);
          }
        }
        nav.appendChild(a);
      });
      /* تحديد الصفحة الحالية */
      var cur = window.location.hash || R.HOME || '#';
      nav.querySelectorAll('a').forEach(function (a) {
        if (a.getAttribute('data-route') === cur) a.classList.add('active');
      });
      /* sync صورة الأفاتار */
      var origPaint = App.paintAccount.bind(App);
      App.paintAccount = function (st) {
        origPaint(st);
        var ni = document.getElementById('nav-avatar-img');
        if (ni && st && st.profile && st.profile.avatar_url) {
          ni.src = st.profile.avatar_url;
        }
      };
      /* إضافة listener لزر الإعدادات في الـ topbar */
      var btnSettings = document.getElementById('btn-settings');
      if (btnSettings) {
        btnSettings.addEventListener('click', function () {
          if (window.Utils) Utils.go(R.SETTINGS || '#settings');
        });
      }
    };
  }
  patchApp();
});
</script>
<script>
/* إخفاء/إظهار bottom-nav عند scroll */
(function () {
  var lastY = 0, ticking = false;
  function onScroll() {
    if (!ticking) {
      window.requestAnimationFrame(function () {
        var nav = document.querySelector('.bottom-nav');
        if (!nav) { ticking = false; return; }
        var y = window.scrollY || document.documentElement.scrollTop;
        var delta = y - lastY;
        if (delta > 10 && y > 60) {
          nav.classList.add('nav--hidden');
        } else if (delta < -8) {
          nav.classList.remove('nav--hidden');
        }
        lastY = y;
        ticking = false;
      });
      ticking = true;
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
})();
</script>
