<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مستخرج Ouedkniss - GraphQL</title>
<style>
:root {
  --bg: #f4f6fb;
  --card: #fff;
  --primary: #5c6bc0;
  --primary-dark: #3949ab;
  --success: #43a047;
  --error: #e53935;
  --warn: #fb8c00;
  --text: #212121;
  --sub: #757575;
  --border: #e0e0e0;
  --console-bg: #1a1a2e;
  --console-text: #c8d6f5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f1a;
    --card: #1e1e30;
    --border: #333;
    --text: #e0e0e0;
    --sub: #aaa;
  }
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.topbar {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  padding: 22px 24px 18px;
  text-align: center;
}
.topbar h1 { font-size: 1.5em; margin-bottom: 4px; }
.topbar p { font-size: 0.85em; opacity: .85; }

.controls {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
.field label { font-size: 12px; color: var(--sub); font-weight: 600; }
input, select {
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  transition: border-color .2s;
}
input:focus, select:focus { outline: none; border-color: var(--primary); }

.btn {
  padding: 10px 22px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-success { background: var(--success); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Stats */
.stats {
  display: flex;
  gap: 12px;
  padding: 14px 20px;
  background: var(--bg);
  flex-wrap: wrap;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 18px;
  text-align: center;
  min-width: 110px;
  flex: 1;
}
.stat .val { font-size: 1.8em; font-weight: 800; color: var(--primary); }
.stat .lbl { font-size: 11px; color: var(--sub); margin-top: 2px; }

/* Layout */
.layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  min-height: 600px;
}
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
}

/* Results */
.results-panel { padding: 16px 20px; overflow-y: auto; max-height: 700px; }
.panel-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.panel-title h2 { font-size: 1em; color: var(--text); }

.ads-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.ad-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}
.ad-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
.ad-img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: var(--border);
  display: block;
}
.ad-img-placeholder {
  width: 100%;
  height: 180px;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2em;
  color: var(--sub);
}
.ad-body { padding: 12px; }
.ad-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 6px;
}
.ad-price { font-size: 16px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
.ad-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.tag {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 11px;
  color: var(--sub);
}
.ad-link {
  display: inline-block;
  color: var(--primary);
  font-size: 12px;
  text-decoration: none;
  margin-top: 4px;
}
.ad-link:hover { text-decoration: underline; }

/* Console */
.console-panel {
  background: var(--console-bg);
  color: var(--console-text);
  display: flex;
  flex-direction: column;
  max-height: 700px;
}
.console-head {
  background: #111126;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #333;
}
.console-head span { font-size: 13px; color: #aac; font-weight: 700; }
.cbtn {
  background: #2a2a4a;
  color: #aac;
  border: none;
  padding: 5px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  margin-right: 6px;
}
.cbtn:hover { background: #3a3a6a; }
.console-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  font-family: 'Consolas', monospace;
  font-size: 12px;
  line-height: 1.7;
}
.cline { display: flex; gap: 8px; border-bottom: 1px solid #1f1f3a; padding: 2px 0; }
.ctime { color: #4a5a7a; min-width: 60px; flex-shrink: 0; }
.cline.info .cmsg { color: #7ec8e3; }
.cline.success .cmsg { color: #81c784; }
.cline.warn .cmsg { color: #ffb74d; }
.cline.error .cmsg { color: #ef9a9a; }
.cline.data .cmsg { color: #ce93d8; }

/* Empty */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--sub);
}
.empty .icon { font-size: 3em; margin-bottom: 12px; }
.empty h3 { margin-bottom: 6px; }
.empty p { font-size: 13px; }

/* Error box */
.error-box {
  background: #fff3f3;
  border: 1px solid #ffcdd2;
  border-radius: 10px;
  padding: 16px;
  margin: 16px 20px;
  color: #c62828;
  font-size: 13px;
}

/* Pagination */
.pagination {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 16px;
  flex-wrap: wrap;
}
.page-btn {
  padding: 7px 14px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
}
.page-btn:hover, .page-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.method-row {
  display: flex;
  gap: 8px;
  padding: 10px 20px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
  font-size: 12px;
}
.method-row span { color: var(--sub); font-weight: 600; margin-left: 4px; }
.mbadge {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  border: 1.5px solid var(--border);
  color: var(--sub);
  background: var(--bg);
  transition: all .2s;
}
.mbadge.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.mbadge.ok { background: var(--success); color: #fff; border-color: var(--success); }
.mbadge.fail { background: var(--error); color: #fff; border-color: var(--error); }
</style>
</head>
<body>

<div class="topbar">
  <h1>🔍 مستخرج Ouedkniss</h1>
  <p>يستخدم GraphQL API الرسمي للموقع — لا حاجة لـ CORS proxy</p>
</div>

<div class="controls">
  <div class="field">
    <label>الفئة (Slug)</label>
    <input id="slug" value="vetements_mode-femmes" placeholder="مثال: vetements_mode-femmes">
  </div>
  <div class="field" style="max-width:130px">
    <label>الصفحة</label>
    <input id="pageNum" type="number" value="1" min="1">
  </div>
  <div class="field" style="max-width:130px">
    <label>عدد النتائج</label>
    <select id="countPer">
      <option value="24">24</option>
      <option value="48" selected>48</option>
      <option value="96">96</option>
    </select>
  </div>
  <div class="field" style="max-width:180px">
    <label>كلمة بحث (اختياري)</label>
    <input id="keyword" placeholder="مثال: فستان">
  </div>
  <button class="btn btn-primary" id="fetchBtn" onclick="fetchAds()">🚀 استخراج</button>
  <button class="btn btn-secondary" onclick="clearAll()">🗑️ مسح</button>
</div>

<div class="method-row">
  <span>الطريقة:</span>
  <div class="mbadge" id="m1">1. GraphQL API</div>
  <div class="mbadge" id="m2">2. REST Search API</div>
  <div class="mbadge" id="m3">3. CORS Proxy + GraphQL</div>
</div>

<div class="stats" id="statsBox" style="display:none">
  <div class="stat"><div class="val" id="sTotal">0</div><div class="lbl">إجمالي الإعلانات</div></div>
  <div class="stat"><div class="val" id="sPage" style="color:var(--success)">0</div><div class="lbl">في هذه الصفحة</div></div>
  <div class="stat"><div class="val" id="sPages" style="color:var(--warn)">0</div><div class="lbl">عدد الصفحات</div></div>
  <div class="stat"><div class="val" id="sMethod" style="font-size:.9em;color:var(--sub)">-</div><div class="lbl">الطريقة الناجحة</div></div>
</div>

<div class="layout">
  <div class="results-panel">
    <div class="panel-title">
      <h2 id="panelTitle">النتائج</h2>
      <button class="btn btn-success" id="exportBtn" style="display:none;font-size:12px;padding:7px 16px" onclick="exportJSON()">💾 تصدير JSON</button>
    </div>
    <div id="resultsContainer">
      <div class="empty">
        <div class="icon">🔎</div>
        <h3>جاهز للاستخراج</h3>
        <p>اضغط "استخراج" للبدء</p>
      </div>
    </div>
    <div id="paginationBox" class="pagination" style="display:none"></div>
  </div>

  <div class="console-panel">
    <div class="console-head">
      <span>🖥️ سجل العمليات</span>
      <div>
        <button class="cbtn" onclick="copyLog()">📋 نسخ</button>
        <button class="cbtn" onclick="clearLog()">🗑️ مسح</button>
      </div>
    </div>
    <div class="console-body" id="consoleBody">
      <div class="cline info"><span class="ctime">--:--</span><span class="cmsg">جاهز...</span></div>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────
let allAds = [];
let logs = [];
let currentPage = 1;

// ─── Logging ─────────────────────────────────────────────
function log(msg, type='info') {
  const t = new Date().toLocaleTimeString('ar-DZ', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  logs.push({t, type, msg});
  const body = document.getElementById('consoleBody');
  const div = document.createElement('div');
  div.className = 'cline ' + type;
  div.innerHTML = `<span class="ctime">${t}</span><span class="cmsg">${msg}</span>`;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  console[type === 'error' ? 'error' : type === 'warn' ? 'warn' : 'log'](`[${type}]`, msg);
}
function clearLog() {
  logs = [];
  document.getElementById('consoleBody').innerHTML = '<div class="cline info"><span class="ctime">--:--</span><span class="cmsg">تم المسح</span></div>';
}
function copyLog() {
  navigator.clipboard.writeText(logs.map(l => `[${l.t}][${l.type}] ${l.msg}`).join('\n'));
  log('تم نسخ السجل ✅', 'success');
}

// ─── Method Badges ────────────────────────────────────────
function setMethod(id, status) {
  const el = document.getElementById(id);
  el.className = 'mbadge ' + (status === 'active' ? 'active' : status === 'ok' ? 'ok' : status === 'fail' ? 'fail' : '');
}
function resetMethods() {
  ['m1','m2','m3'].forEach(m => document.getElementById(m).className = 'mbadge');
}

// ─── GraphQL Query ────────────────────────────────────────
function buildGraphQL(slug, page, count, keyword) {
  const filters = keyword
    ? `keyword: "${keyword}", categorySlug: "${slug}"`
    : `categorySlug: "${slug}"`;
  return {
    operationName: "SearchQuery",
    variables: {
      filter: {
        categorySlug: slug,
        ...(keyword ? { keyword } : {}),
        count: count,
        page: page,
      },
      mediaSize: "MEDIUM"
    },
    query: `
      query SearchQuery($filter: SearchFilter, $mediaSize: MediaSize) {
        search(filter: $filter) {
          announcements {
            data {
              id
              title
              description
              price
              priceUnit
              priceType
              location { name wilaya }
              category { name slug }
              medias(size: $mediaSize) { url }
              user { username }
              publishedAt
              hasExchange
              delivery
              slug
            }
            paginatorInfo {
              total
              lastPage
              currentPage
              perPage
            }
          }
        }
      }
    `
  };
}

// ─── Method 1: GraphQL Direct ─────────────────────────────
async function tryGraphQL(slug, page, count, keyword) {
  const body = buildGraphQL(slug, page, count, keyword);
  const res = await fetch('https://www.ouedkniss.com/graphql', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json',
      'Origin': 'https://www.ouedkniss.com',
      'Referer': 'https://www.ouedkniss.com/',
    },
    body: JSON.stringify(body),
    credentials: 'omit'
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0].message);
  const search = data?.data?.search?.announcements;
  if (!search) throw new Error('لا توجد بيانات في الاستجابة');
  return search;
}

// ─── Method 2: REST API ───────────────────────────────────
async function tryRESTAPI(slug, page, count, keyword) {
  const kw = keyword ? `&q=${encodeURIComponent(keyword)}` : '';
  const url = `https://www.ouedkniss.com/api/v2/search?category=${encodeURIComponent(slug)}&page=${page}&count=${count}${kw}`;
  const res = await fetch(url, {
    headers: { 'Accept': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
    credentials: 'omit'
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  // Normalize to same shape as GraphQL
  const ads = (data.data || data.announcements || data.results || []).map(normalizeRESTAd);
  return {
    data: ads,
    paginatorInfo: {
      total: data.meta?.total || data.total || ads.length,
      lastPage: data.meta?.last_page || data.lastPage || 1,
      currentPage: page,
      perPage: count
    }
  };
}

// ─── Method 3: CORS Proxy + GraphQL ──────────────────────
async function tryCORSProxy(slug, page, count, keyword) {
  const body = buildGraphQL(slug, page, count, keyword);
  const targetUrl = 'https://www.ouedkniss.com/graphql';
  const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
  const res = await fetch(proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
  const data = await res.json();
  if (data.errors) throw new Error(data.errors[0].message);
  const search = data?.data?.search?.announcements;
  if (!search) throw new Error('لا توجد بيانات');
  return search;
}

// ─── Normalize REST response ──────────────────────────────
function normalizeRESTAd(ad) {
  return {
    id: ad.id,
    title: ad.title || ad.name || '',
    description: ad.description || '',
    price: ad.price || ad.prix || '',
    priceUnit: ad.priceUnit || ad.currency || 'DA',
    priceType: ad.priceType || '',
    location: { name: ad.commune || ad.location || '', wilaya: ad.wilaya || '' },
    category: { name: ad.category || '', slug: ad.categorySlug || '' },
    medias: (ad.images || ad.photos || ad.medias || []).map(u => ({url: typeof u === 'string' ? u : u.url})),
    user: { username: ad.seller || ad.user?.username || '' },
    publishedAt: ad.publishedAt || ad.created_at || '',
    slug: ad.slug || ''
  };
}

// ─── Main Fetch ───────────────────────────────────────────
async function fetchAds() {
  const slug = document.getElementById('slug').value.trim();
  const page = parseInt(document.getElementById('pageNum').value) || 1;
  const count = parseInt(document.getElementById('countPer').value) || 48;
  const keyword = document.getElementById('keyword').value.trim();

  if (!slug) { log('⚠️ أدخل الـ slug أولاً', 'warn'); return; }

  document.getElementById('fetchBtn').disabled = true;
  document.getElementById('fetchBtn').textContent = '⏳ ...';
  resetMethods();
  showLoading();
  allAds = [];

  log(`🚀 بدء الاستخراج — الفئة: ${slug}, الصفحة: ${page}, العدد: ${count}${keyword ? ', بحث: ' + keyword : ''}`, 'info');

  const methods = [
    { id: 'm1', name: 'GraphQL API', fn: () => tryGraphQL(slug, page, count, keyword) },
    { id: 'm2', name: 'REST API', fn: () => tryRESTAPI(slug, page, count, keyword) },
    { id: 'm3', name: 'CORS Proxy', fn: () => tryCORSProxy(slug, page, count, keyword) },
  ];

  let result = null;
  let usedMethod = '-';

  for (const m of methods) {
    setMethod(m.id, 'active');
    log(`🔄 جاري المحاولة: ${m.name}...`, 'info');
    try {
      result = await m.fn();
      setMethod(m.id, 'ok');
      usedMethod = m.name;
      log(`✅ نجحت الطريقة: ${m.name}`, 'success');
      // Mark rest as skipped
      break;
    } catch(e) {
      setMethod(m.id, 'fail');
      log(`❌ فشلت ${m.name}: ${e.message}`, 'error');
      await sleep(600);
    }
  }

  document.getElementById('fetchBtn').disabled = false;
  document.getElementById('fetchBtn').textContent = '🚀 استخراج';

  if (!result) {
    log('❌ فشلت جميع الطرق. انظر السجل للتفاصيل.', 'error');
    log('💡 تأكد من الاتصال بالإنترنت وأن slug صحيح', 'warn');
    showError('فشلت جميع طرق الاتصال. تحقق من اسم الفئة (slug) ومن اتصالك بالإنترنت.');
    return;
  }

  const ads = result.data || [];
  const info = result.paginatorInfo || {};

  allAds = ads;
  log(`📦 تم جلب ${ads.length} إعلان من أصل ${info.total || '?'}`, 'data');
  log(`📄 الصفحة ${info.currentPage} من ${info.lastPage}`, 'data');

  // Stats
  document.getElementById('statsBox').style.display = 'flex';
  document.getElementById('sTotal').textContent = info.total || ads.length;
  document.getElementById('sPage').textContent = ads.length;
  document.getElementById('sPages').textContent = info.lastPage || 1;
  document.getElementById('sMethod').textContent = usedMethod;

  renderAds(ads);
  renderPagination(info, slug, count, keyword);

  if (ads.length > 0) {
    document.getElementById('exportBtn').style.display = 'inline-block';
    document.getElementById('panelTitle').textContent = `النتائج (${ads.length} إعلان)`;
  }
}

// ─── Render ───────────────────────────────────────────────
function renderAds(ads) {
  const c = document.getElementById('resultsContainer');
  if (!ads || ads.length === 0) {
    c.innerHTML = `<div class="empty"><div class="icon">📭</div><h3>لا توجد إعلانات</h3><p>جرب تغيير الفئة أو الكلمة المفتاحية</p></div>`;
    return;
  }

  c.innerHTML = `<div class="ads-grid">${ads.map(ad => renderCard(ad)).join('')}</div>`;
}

function renderCard(ad) {
  const imgUrl = ad.medias && ad.medias.length > 0 ? ad.medias[0].url : null;
  const price = ad.price ? `${formatNum(ad.price)} ${ad.priceUnit || 'دج'}` : 'السعر عند الاتصال';
  const loc = [ad.location?.name, ad.location?.wilaya].filter(Boolean).join('، ');
  const date = ad.publishedAt ? new Date(ad.publishedAt).toLocaleDateString('ar-DZ') : '';
  const link = ad.slug ? `https://www.ouedkniss.com/annonce/${ad.slug}` : '#';

  return `
    <div class="ad-card">
      ${imgUrl
        ? `<img class="ad-img" src="${esc(imgUrl)}" alt="${esc(ad.title)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="ad-img-placeholder" ${imgUrl ? 'style="display:none"' : ''}>🖼️</div>
      <div class="ad-body">
        <div class="ad-title">${esc(ad.title)}</div>
        <div class="ad-price">${price}</div>
        <div class="ad-tags">
          ${loc ? `<span class="tag">📍 ${esc(loc)}</span>` : ''}
          ${ad.category?.name ? `<span class="tag">🏷️ ${esc(ad.category.name)}</span>` : ''}
          ${date ? `<span class="tag">📅 ${date}</span>` : ''}
          ${ad.user?.username ? `<span class="tag">👤 ${esc(ad.user.username)}</span>` : ''}
          ${ad.delivery ? `<span class="tag" style="color:var(--success)">🚚 توصيل</span>` : ''}
        </div>
        ${ad.description ? `<p style="font-size:12px;color:var(--sub);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(ad.description)}</p>` : ''}
        <a class="ad-link" href="${esc(link)}" target="_blank" rel="noopener">🔗 عرض الإعلان</a>
      </div>
    </div>
  `;
}

function renderPagination(info, slug, count, keyword) {
  const box = document.getElementById('paginationBox');
  const last = info.lastPage || 1;
  if (last <= 1) { box.style.display = 'none'; return; }

  box.style.display = 'flex';
  const cur = info.currentPage || 1;

  let pages = [];
  pages.push(1);
  for (let i = Math.max(2, cur - 2); i <= Math.min(last - 1, cur + 2); i++) pages.push(i);
  if (last > 1) pages.push(last);
  pages = [...new Set(pages)];

  box.innerHTML = pages.map(p => `
    <button class="page-btn ${p === cur ? 'active' : ''}"
      onclick="goPage(${p})">${p}</button>
  `).join('');
}

function goPage(p) {
  document.getElementById('pageNum').value = p;
  fetchAds();
}

// ─── Helpers ──────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatNum(n) {
  return Number(n).toLocaleString('ar-DZ');
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showLoading() {
  document.getElementById('resultsContainer').innerHTML = `
    <div class="empty">
      <div class="icon" style="animation:spin 1s linear infinite;display:inline-block">⏳</div>
      <h3>جاري الاستخراج...</h3>
      <p>يتم الاتصال بـ API الخاص بـ Ouedkniss</p>
    </div>`;
  document.getElementById('paginationBox').style.display = 'none';
}

function showError(msg) {
  document.getElementById('resultsContainer').innerHTML = `
    <div class="error-box">❌ ${esc(msg)}</div>
    <div class="empty">
      <div class="icon">🔧</div>
      <h3>نصائح لحل المشكلة</h3>
      <p>1. تأكد أن اسم الفئة (slug) صحيح<br>
         2. جرب slug آخر مثل: <strong>immobilier</strong> أو <strong>informatique</strong><br>
         3. تأكد من اتصالك بالإنترنت</p>
    </div>`;
}

function clearAll() {
  allAds = [];
  document.getElementById('resultsContainer').innerHTML = `<div class="empty"><div class="icon">🔎</div><h3>جاهز</h3><p>اضغط "استخراج" للبدء</p></div>`;
  document.getElementById('statsBox').style.display = 'none';
  document.getElementById('paginationBox').style.display = 'none';
  document.getElementById('exportBtn').style.display = 'none';
  document.getElementById('panelTitle').textContent = 'النتائج';
  resetMethods();
  log('🗑️ تم مسح النتائج', 'info');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(allAds, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ouedkniss_${document.getElementById('slug').value}_p${document.getElementById('pageNum').value}.json`;
  a.click();
  URL.revokeObjectURL(url);
  log('💾 تم تصدير البيانات', 'success');
}
