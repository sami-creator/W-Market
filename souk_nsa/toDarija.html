<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعبئة الفورم بالصوت</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
    direction: rtl;
    color: #1a1a1a;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 18px;
    color: #1a1a1a;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 12px;
  }
  label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 6px;
    color: #374151;
  }
  input[type="password"], input[type="text"], textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
    margin-bottom: 14px;
  }
  input:focus, textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  textarea { resize: vertical; min-height: 80px; line-height: 1.7; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }

  .mic-btn {
    background: #dc2626;
    color: #fff;
    border: none;
    padding: 16px 24px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    margin: 16px 0;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .mic-btn:hover:not(:disabled) { background: #b91c1c; }
  .mic-btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .mic-btn.recording {
    background: #059669;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(5,150,105,0.5); }
    50% { box-shadow: 0 0 0 14px rgba(5,150,105,0); }
  }
  .status {
    margin-top: 10px;
    font-size: 13px;
    color: #6b7280;
    text-align: center;
    min-height: 20px;
  }
  .status.error { color: #dc2626; }
  .status.ok { color: #059669; }

  .transcript-box {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    padding: 14px;
    margin-top: 10px;
    font-size: 14px;
    min-height: 60px;
    line-height: 1.8;
    color: #0c4a6e;
  }

  .console {
    margin-top: 18px;
    background: #0f172a;
    color: #e2e8f0;
    padding: 14px;
    border-radius: 8px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 12px;
    direction: ltr;
    text-align: left;
    max-height: 200px;
    overflow: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .hint { font-size: 12px; color: #6b7280; margin: -10px 0 12px; }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: #2563eb;
    margin: 18px 0 10px;
    padding-top: 12px;
    border-top: 1px solid #e5e7eb;
  }
  .section-title:first-of-type { border-top: none; padding-top: 0; }
</style>
</head>
<body>

<div class="container">
  <h1>🎙️ تعبئة الفورم بالصوت</h1>

  <label for="apiKey">مفتاح Groq API</label>
  <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off">
  <p class="hint">احصل على مفتاح مجاني من console.groq.com</p>

  <button id="micBtn" class="mic-btn">
    <span id="micIcon">🎤</span>
    <span id="micText">اضغط وتكلم</span>
  </button>

  <div class="status" id="status"></div>

  <div class="transcript-box" id="transcriptBox">لم يتم التسجيل بعد...</div>

  <div class="section-title">البيانات الشخصية</div>

  <div class="row">
    <div>
      <label for="firstName">الاسم</label>
      <input type="text" id="firstName" placeholder="سيتم ملؤه تلقائياً">
    </div>
    <div>
      <label for="lastName">اللقب</label>
      <input type="text" id="lastName" placeholder="سيتم ملؤه تلقائياً">
    </div>
  </div>

  <label for="bio">نبذة (Bio)</label>
  <textarea id="bio" placeholder="سيتم ملؤه تلقائياً"></textarea>

  <div class="section-title">الموقع الجغرافي</div>

  <label for="wilaya">الولاية</label>
  <input type="text" id="wilaya" placeholder="سيتم ملؤه تلقائياً">

  <div class="row">
    <div>
      <label for="daira">الدائرة</label>
      <input type="text" id="daira" placeholder="سيتم ملؤه تلقائياً">
    </div>
    <div>
      <label for="commune">البلدية</label>
      <input type="text" id="commune" placeholder="سيتم ملؤه تلقائياً">
    </div>
  </div>

  <div class="section-title">معلومات الاتصال</div>

  <label for="phone">رقم الهاتف</label>
  <input type="text" id="phone" placeholder="سيتم ملؤه تلقائياً">

  <div class="console" id="console">[جاهز]</div>
</div>

<script>
const apiKeyInput = document.getElementById('apiKey');
const micBtn      = document.getElementById('micBtn');
const micIcon     = document.getElementById('micIcon');
const micText     = document.getElementById('micText');
const statusEl    = document.getElementById('status');
const transcriptBox = document.getElementById('transcriptBox');
const consoleEl   = document.getElementById('console');

// الحقول
const fields = ['firstName','lastName','bio','wilaya','daira','commune','phone'];

function log(msg, isError=false){
  const time = new Date().toLocaleTimeString();
  consoleEl.textContent += `\n[${time}] ${msg}`;
  consoleEl.scrollTop = consoleEl.scrollHeight;
  if(isError) console.error(msg);
}

function setStatus(msg, type=''){
  statusEl.textContent = msg;
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

// حفظ مفتاح API
if(localStorage.getItem('groq_api_key')){
  apiKeyInput.value = localStorage.getItem('groq_api_key');
  log('تم استرجاع مفتاح API المحفوظ');
}
apiKeyInput.addEventListener('change', () => {
  localStorage.setItem('groq_api_key', apiKeyInput.value.trim());
  log('تم حفظ مفتاح API');
});

/* ============================================================
   تسجيل الصوت
   ============================================================ */
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

micBtn.addEventListener('click', async () => {
  if(isRecording){
    stopRecording();
    return;
  }
  await startRecording();
});

async function startRecording(){
  const apiKey = apiKeyInput.value.trim();
  if(!apiKey){
    setStatus('أدخل مفتاح API أولاً', 'error');
    return;
  }

  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => {
      if(e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      log('حجم التسجيل: ' + (audioBlob.size/1024).toFixed(1) + ' KB');
      stream.getTracks().forEach(t => t.stop());
      await processAudio(audioBlob);
    };

    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micIcon.textContent = '⏹️';
    micText.textContent = 'اضغط للإيقاف';
    setStatus('🔴 جاري التسجيل... تكلم الآن');
    log('بدء التسجيل');

  }catch(err){
    setStatus('تعذّر الوصول للميكروفون: ' + err.message, 'error');
    log('خطأ الميكروفون: ' + err.message, true);
  }
}

function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    mediaRecorder.stop();
    isRecording = false;
    micBtn.classList.remove('recording');
    micIcon.textContent = '🎤';
    micText.textContent = 'اضغط وتكلم';
    setStatus('⏳ جاري المعالجة...');
    log('إيقاف التسجيل');
  }
}

/* ============================================================
   إرسال الصوت إلى Groq Whisper للتفريغ النصي
   ============================================================ */
async function processAudio(audioBlob){
  const apiKey = apiKeyInput.value.trim();

  try{
    const formData = new FormData();
    formData.append('file', audioBlob, 'recording.webm');
    formData.append('model', 'whisper-large-v3');
    formData.append('language', 'ar');
    formData.append('response_format', 'json');

    log('إرسال الصوت إلى Whisper...');
    const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + apiKey },
      body: formData
    });

    if(!res.ok){
      const errText = await res.text();
      throw new Error(`Whisper HTTP ${res.status}: ${errText}`);
    }

    const data = await res.json();
    const transcript = data.text?.trim();

    if(!transcript) throw new Error('لم يتم استلام نص');

    transcriptBox.textContent = transcript;
    log('النص المُفرَّغ: ' + transcript);

    // الآن نرسل النص إلى LLM لملء الفورم
    await fillForm(transcript, apiKey);

  }catch(err){
    setStatus('❌ خطأ: ' + err.message, 'error');
    log('خطأ: ' + err.message, true);
  }
}

/* ============================================================
   استخراج البيانات وملء الفورم عبر LLM
   ============================================================ */
async function fillForm(transcript, apiKey){
  setStatus('🤖 جاري استخراج البيانات وملء الفورم...');
  log('إرسال النص إلى LLM لتحليل البيانات...');

  const systemPrompt = `أنت مساعد ذكي يستخرج معلومات شخصية من نص منطوق بالدارجة الجزائرية أو العربية أو الفرنسية أو خليط بينهم.

مهمتك: استخرج الحقول التالية من النص، وأعدها بصيغة JSON نظيفة فقط (بدون شرح، بدون markdown، بدون backticks):
{
  "firstName": "الاسم فقط، أو null",
  "lastName": "اللقب فقط، أو null",
  "bio": "نبذة قصيرة عن الشخص أو نشاطه، بالعربية الفصحى المبسطة، أو null",
  "wilaya": "اسم الولاية الجزائرية بالعربية، أو null",
  "daira": "اسم الدائرة بالعربية، أو null",
  "commune": "اسم البلدية بالعربية، أو null",
  "phone": "رقم الهاتف بصيغة دولية إن أمكن، أو null"
}

قواعد مهمة:
- إذا قال "سطيف سونتر فيل" فهذا يعني: wilaya = سطيف، commune = سطيف (البلدية).
- إذا ذكر اسم ولاية فقط، ضعها في wilaya واترك daira و commune فارغين إن لم يذكرا.
- إذا ذكر دائرة معروفة، ضعها في daira.
- إذا لم تجد قيمة لحقل، ضع null.
- رقم الهاتف الجزائري يبدأ بـ 0 ويتكون من 10 أرقام، أو بصيغة +213.
- اكتب أسماء الولايات والبلديات بالعربية الصحيحة.
- لا تخترع معلومات غير موجودة في النص.`;

  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: 'openai/gpt-oss-120b',
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: transcript }
        ],
        temperature: 0.1,
        max_tokens: 800,
        response_format: { type: 'json_object' }
      })
    });

    if(!res.ok){
      const errText = await res.text();
      throw new Error(`LLM HTTP ${res.status}: ${errText}`);
    }

    const data = await res.json();
    let content = data?.choices?.[0]?.message?.content?.trim();

    if(!content) throw new Error('لم يتم استلام بيانات من LLM');

    log('استجابة LLM: ' + content);

    // إزالة أي backticks إن وُجدت
    content = content.replace(/```json/g, '').replace(/```/g, '').trim();

    const parsed = JSON.parse(content);

    // ملء الحقول
    for(const key of fields){
      const el = document.getElementById(key);
      if(el && parsed[key] !== null && parsed[key] !== undefined){
        el.value = parsed[key];
      }
    }

    setStatus('✅ تمت تعبئة الفورم بنجاح', 'ok');
    log('تمت تعبئة الفورم');

  }catch(err){
    setStatus('❌ خطأ في التحليل: ' + err.message, 'error');
    log('خطأ LLM: ' + err.message, true);
  }
}
</script>

</body>
</html>
